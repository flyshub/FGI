name: Cron Health Check

on:
  schedule:
    - cron: '0 8 * * 1,4'  # 周一和周四 08:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check recent runs
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const threeDaysAgo = new Date(now.getTime() - 3 * 24 * 60 * 60 * 1000).toISOString();
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily_update.yml',
              created: `>=${threeDaysAgo}`,
              per_page: 5,
            });

            const successRuns = runs.data.workflow_runs.filter(r => r.conclusion === 'success');
            if (successRuns.length === 0) {
              const recentUrl = `${context.serverUrl}/${context.repo.full_name}/actions`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔔 FGI 定时任务可能已停止',
                body: `## 定时任务异常\n\n最近 3 天没有发现成功的 FGI 每日更新。\n\n可能原因：\n- GitHub Actions cron 被静默禁用\n- workflow 文件语法错误\n- 上游依赖变更\n\n请检查：[Actions 页面](${recentUrl})\n\n如果需要重新启用，去 Settings → Actions → General → 确保 "Allow GitHub Actions to create and approve pull requests" 开启。`,
                labels: ['bug', 'automation'],
              });
            } else {
              console.log(`Found ${successRuns.length} successful runs in the last 3 days. Health OK.`);
            }
