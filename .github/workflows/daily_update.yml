name: FGI Daily Update

on:
  schedule:
    # 主跑：工作日 18:00 北京时间（10:00 UTC）
    - cron: '0 10 * * 1-5'
    # 兜底：21:30 北京时间（13:30 UTC）。GitHub 免费 cron 经常延迟甚至整天不触发，
    # 这一趟只在「当天还没算出来」时才真正执行，否则一步跳过。
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to run (YYYY-MM-DD)'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # 用于创建失败通知 Issue
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 数据库不再提交到仓库：每次从 Release 资产恢复基线，成功跑完后覆盖回传。
      # 缺失即失败——空库会让当天分数覆盖历史，页面只剩一天数据。
      - name: Restore DB baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download data-latest --pattern fgi.db --dir data --clobber
          ls -lh data/fgi.db

      - name: Get target date
        id: date
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "target_date=$INPUT_DATE" >> $GITHUB_OUTPUT
          else
            echo "target_date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      # 决定这一趟要不要真的算：
      #   1. 周末直接跳过（精确交易日判断由 daily_run 内部完成）
      #   2. 兜底 cron 只在当天还没有分数时执行，避免重复推送与重复提交
      - name: Check whether to run
        id: check
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          DAY=$(date -d "$TARGET_DATE" +%u 2>/dev/null || date -j -u -f "%Y-%m-%d" "$TARGET_DATE" +%u 2>/dev/null)

          SKIP=false
          if [ -n "$DAY" ] && [ "$DAY" -ge 6 ]; then
            echo "Weekend — nothing to do."
            SKIP=true
          fi

          if [ "$SKIP" = "false" ] && [ "$EVENT_SCHEDULE" = "30 13 * * 1-5" ]; then
            if python -m fgi.output.check_ran; then
              echo "Fallback run: $TARGET_DATE already computed — skipping."
              SKIP=true
            fi
          fi

          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Run FGI daily update (first pass, no push)
        id: run_fgi
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        env:
          FGI_PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FGI_PUSHPLUS_FRIENDS: ${{ secrets.PUSHPLUS_FRIENDS }}
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: python -m fgi.output.daily_run --date "$TARGET_DATE" --first-pass

      - name: Backfill late data (replaces forward-filled with real values)
        id: backfill
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        env:
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: python -m fgi.output.backfill_late --days 5

      - name: Re-run FGI for today with corrected data (with push)
        id: run_fgi_final
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        env:
          FGI_PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FGI_PUSHPLUS_FRIENDS: ${{ secrets.PUSHPLUS_FRIENDS }}
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: python -m fgi.output.daily_run --date "$TARGET_DATE"

      # 失败判定必须在任何写回动作之前完成。
      # failed   = 主计算失败 → 不写任何数据（DB / web data 都不动）
      # degraded = 补齐步骤失败 → 数据可写回，但要开 issue 提醒人工看
      - name: Check daily_run outcomes
        id: check_result
        if: steps.check.outputs.skip != 'true'
        env:
          RUN_FGI_OUTCOME: ${{ steps.run_fgi.outcome }}
          RUN_FINAL_OUTCOME: ${{ steps.run_fgi_final.outcome }}
          BACKFILL_OUTCOME: ${{ steps.backfill.outcome }}
        run: |
          if [ "$RUN_FGI_OUTCOME" != "success" ] || [ "$RUN_FINAL_OUTCOME" != "success" ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi
          if [ "$BACKFILL_OUTCOME" != "success" ]; then
            echo "degraded=true" >> $GITHUB_OUTPUT
          else
            echo "degraded=false" >> $GITHUB_OUTPUT
          fi

      - name: Export web data
        if: steps.check.outputs.skip != 'true' && steps.check_result.outputs.failed != 'true'
        env:
          PYTHONPATH: .
        run: python -m fgi.output.web_export --full

      - name: Commit web data
        if: steps.check.outputs.skip != 'true' && steps.check_result.outputs.failed != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No web data changes to commit"
          else
            git commit -m "chore(web): update frontend data for $TARGET_DATE [skip ci]"
            git push
          fi

      - name: Upload DB snapshot to release
        if: steps.check.outputs.skip != 'true' && steps.check_result.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload data-latest data/fgi.db --clobber

      - name: Upload run artifacts
        if: always() && steps.check.outputs.skip != 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        uses: actions/upload-artifact@v4
        with:
          name: fgi-results-${{ env.TARGET_DATE }}
          path: |
            data/fgi.db
            output/
          retention-days: 7

      - name: Create issue on failure
        if: steps.check_result.outputs.failed == 'true' || steps.check_result.outputs.degraded == 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          FAILED: ${{ steps.check_result.outputs.failed }}
          DEGRADED: ${{ steps.check_result.outputs.degraded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            const date = process.env.TARGET_DATE;
            const runUrl = process.env.RUN_URL;
            const failed = process.env.FAILED === 'true';
            const title = failed
              ? `Daily update failed for ${date} — no data written`
              : `Daily update degraded for ${date} — backfill step failed`;
            const body = failed
              ? `daily_run did not succeed, so the DB snapshot and web data were **not** updated (fail-closed).\n\nRun: ${runUrl}`
              : `Backfill step did not succeed. Data was written back, but some indicators may still be forward-filled.\n\nRun: ${runUrl}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automation'],
            });
