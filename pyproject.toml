[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fgi"
version = "3.6.0"
description = "A-Share Fear & Greed Index"
requires-python = ">=3.9"
dependencies = [
    "akshare>=1.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pandas-market-calendars>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "types-requests",
    "types-pyyaml",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["fgi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["var-annotated", "misc", "operator", "valid-type", "arg-type", "union-attr", "attr-defined"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"fgi/output/backfill.py" = ["T201"]
"fgi/output/zt_backfill.py" = ["T201"]
"fgi/output/daily_run.py" = ["T201"]
