[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fgi"
version = "3.9.0"
description = "A-Share Fear & Greed Index"
requires-python = ">=3.10"
dependencies = [
    # akshare 定版：代码依赖 11 个端点（指数/两融/涨停池/QVIX/PE/PB/仓位/资金流…），
    # 上游任一字段改名都会让无人值守的每日管道静默降级，所以不吃浮动版本。
    # 升级流程：改这一行 → 本地真拉一次 → 提交。1.18.75 与 uv.lock 一致。
    "akshare==1.18.88",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pandas-market-calendars>=4.3.0",
    "python-dotenv>=1.0.0",
    "levistock>=0.1.8",
    "zzshare>=0.4.12",
]

[project.optional-dependencies]
# 读 Fuyao market-dumps 的 parquet 需要 pyarrow。只有跑 scripts/validate_m1.py
# 的人才需要装（pip install -e ".[dump]"），CI 的 [dev] 与每日管道都不装。
dump = [
    "pyarrow>=14.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "types-requests",
    "types-pyyaml",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["fgi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
# 按 3.12 检查：numpy 等第三方 stub 使用 3.12 的 `type` 语句，把 target 降到 3.10
# 会让 mypy 直接解析失败。3.10 兼容性由 CI 的 3.10 matrix job 实测保证，不靠 mypy 推断。
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
# 未标注函数体过去被整体跳过，于是 arg-type / union-attr / attr-defined 形同虚设。
# 打开后这三类错误重新具备拦截力（2026-11-18 评审 P1-4）。
check_untyped_defs = true
disable_error_code = ["var-annotated", "misc", "operator", "valid-type"]

[[tool.mypy.overrides]]
# 测试里大量 mock/fixture 是动态形状，强制检查函数体只会产出噪声（Optional 收窄、
# 动态属性），不反映生产风险。生产代码（fgi.*）仍是全量检查。
module = ["tests.*"]
check_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"fgi/output/backfill.py" = ["T201"]
"fgi/output/zt_backfill.py" = ["T201"]
"fgi/output/daily_run.py" = ["T201"]
"fgi/output/check_ran.py" = ["T201"]
